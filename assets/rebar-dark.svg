<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Rebar, my own product: a multilingual Kurdish business platform, live on the App Store, Google Play and the web">
  <rect x="0.5" y="0.5" width="1199" height="249" rx="19.5" fill="#141413" stroke="#262624"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="62" font-size="13" font-weight="600" fill="#60a5fa" letter-spacing="2.4">OWN PRODUCT</text>
    <text x="64" y="106" font-size="34" font-weight="800" fill="#e8e8e6" letter-spacing="-0.8">Rebar <tspan font-weight="600" fill="#8b8b86">ڕێبەر</tspan></text>
    <text x="64" y="142" font-size="17" fill="#a8a8a4">Kurdish business platform and a 273,000 word dictionary. Built and run alone, from database to store release.</text>
    <rect x="64" y="170" width="45" height="30" rx="7" fill="none" stroke="#262624"/><text x="86" y="190" text-anchor="middle" font-size="13" fill="#a8a8a4">iOS</text><rect x="116.8" y="170" width="75" height="30" rx="7" fill="none" stroke="#262624"/><text x="154" y="190" text-anchor="middle" font-size="13" fill="#a8a8a4">Android</text><rect x="200.0" y="170" width="45" height="30" rx="7" fill="none" stroke="#262624"/><text x="222" y="190" text-anchor="middle" font-size="13" fill="#a8a8a4">Web</text><rect x="252.8" y="170" width="68" height="30" rx="7" fill="none" stroke="#262624"/><text x="287" y="190" text-anchor="middle" font-size="13" fill="#a8a8a4">NestJS</text><rect x="328.4" y="170" width="98" height="30" rx="7" fill="none" stroke="#262624"/><text x="377" y="190" text-anchor="middle" font-size="13" fill="#a8a8a4">PostgreSQL</text><rect x="434.4" y="170" width="113" height="30" rx="7" fill="none" stroke="#262624"/><text x="491" y="190" text-anchor="middle" font-size="13" fill="#a8a8a4">React Native</text><rect x="555.5999999999999" y="170" width="98" height="30" rx="7" fill="none" stroke="#262624"/><text x="605" y="190" text-anchor="middle" font-size="13" fill="#a8a8a4">RevenueCat</text><rect x="661.5999999999999" y="170" width="151" height="30" rx="7" fill="none" stroke="#262624"/><text x="737" y="190" text-anchor="middle" font-size="13" fill="#a8a8a4">4 languages · RTL</text>
    <text x="1136" y="62" text-anchor="end" font-size="13" font-weight="600" fill="#e8e8e6">Live on App Store, Google Play and web →</text>
  </g>
