<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Rebar, my own product: a multilingual Kurdish business platform, live on the App Store, Google Play and the web">
  <rect x="0.5" y="0.5" width="1199" height="249" rx="19.5" fill="#f4f4f2" stroke="#e7e6e2"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="62" font-size="13" font-weight="600" fill="#1e40af" letter-spacing="2.4">OWN STARTUP · SINCE 2023</text>
    <text x="64" y="106" font-size="34" font-weight="800" fill="#111110" letter-spacing="-0.8">Rebar <tspan font-weight="600" fill="#767672">ڕێبەر</tspan></text>
    <text x="64" y="142" font-size="17" fill="#5a5a57">Kurdish business platform and a 273,000 word dictionary. Built and run alone, from database to store release.</text>
    <rect x="64" y="170" width="45" height="30" rx="7" fill="none" stroke="#e7e6e2"/><text x="86" y="190" text-anchor="middle" font-size="13" fill="#5a5a57">iOS</text><rect x="116.8" y="170" width="75" height="30" rx="7" fill="none" stroke="#e7e6e2"/><text x="154" y="190" text-anchor="middle" font-size="13" fill="#5a5a57">Android</text><rect x="200.0" y="170" width="45" height="30" rx="7" fill="none" stroke="#e7e6e2"/><text x="222" y="190" text-anchor="middle" font-size="13" fill="#5a5a57">Web</text><rect x="252.8" y="170" width="68" height="30" rx="7" fill="none" stroke="#e7e6e2"/><text x="287" y="190" text-anchor="middle" font-size="13" fill="#5a5a57">NestJS</text><rect x="328.4" y="170" width="98" height="30" rx="7" fill="none" stroke="#e7e6e2"/><text x="377" y="190" text-anchor="middle" font-size="13" fill="#5a5a57">PostgreSQL</text><rect x="434.4" y="170" width="113" height="30" rx="7" fill="none" stroke="#e7e6e2"/><text x="491" y="190" text-anchor="middle" font-size="13" fill="#5a5a57">React Native</text><rect x="555.5999999999999" y="170" width="98" height="30" rx="7" fill="none" stroke="#e7e6e2"/><text x="605" y="190" text-anchor="middle" font-size="13" fill="#5a5a57">RevenueCat</text><rect x="661.5999999999999" y="170" width="151" height="30" rx="7" fill="none" stroke="#e7e6e2"/><text x="737" y="190" text-anchor="middle" font-size="13" fill="#5a5a57">4 languages · RTL</text>
    <text x="1136" y="62" text-anchor="end" font-size="13" font-weight="600" fill="#111110">Live since August 2026 →</text>
  </g>
</svg>
